ext {
    mod_id          = "rotarycraft"
    mod_name        = "RotaryCraft"
    mod_group_id    = "reika.rotarycraft"
    mod_description = "RotaryCraft adds rotational energy machinery and complex automation solutions."
}

// Headless JUnit harness: NeoForge moddev loads the mod (and its registries) into the test
// JVM via the FML JUnit launcher, so registry/recipe/serializer integrity can be asserted
// without launching a client. Run with `gradlew :RotaryCraft:test`.
neoForge {
    unitTest {
        enable()
        testedMod = mods.named(project.mod_id).get()
    }
    // Headless in-world game tests: `gradlew :RotaryCraft:runGameTest` launches a GameTestServer
    // that runs every test in the rotarycraft namespace and exits non-zero on failure.
    runs {
        gameTest {
            type = "gameTestServer"
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            def selector = project.hasProperty('gameTestSelector')
                    ? project.property('gameTestSelector').toString()
                    : "${project.mod_id}:*"
            programArguments.addAll '--tests', selector
        }
    }
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation project(":DragonAPI")

    if (file('libs').isDirectory()) {
        compileOnly fileTree(dir: 'libs', include: ['*.jar'])
        localRuntime fileTree(dir: 'libs', include: ['*.jar'])
    }
}

// Test-only foreign steel fixture. This resource source set is never packaged in the release jar.
// It exercises the real common-tag integration without requiring a third-party steel mod.
if (gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('rungametest') }) {
    sourceSets {
        gameTestFixtures {
            resources.srcDir 'src/gametest/resources'
        }
    }
    neoForge.mods.named(project.mod_id) {
        sourceSet(sourceSets.gameTestFixtures)
    }
}

// Optional native GeoStrata parity run; no production dependency on the companion mod.
// gradlew :RotaryCraft:runGameTest -PpileDriverGeoTests -PgameTestSelector=rotarycraft:piledriver_*
if (project.hasProperty('pileDriverGeoTests')) {
    evaluationDependsOn(':GeoStrata')
    dependencies { runtimeOnly project(':GeoStrata') }
    neoForge.mods {
        geostrata { sourceSet project(':GeoStrata').sourceSets.main }
    }
}
